<style>

#stamp{position:absolute;left:0;top:0;padding:10px 22px;border-radius:12px;background:#B79CFF;color:#0E0B14;font-size:34px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;transform-origin:50% 50%}
#lbl{position:absolute;left:-170px;width:340px;text-align:center;top:-70px;font-size:24px;white-space:nowrap}
.dg{position:absolute;top:-30px;width:52px;height:92px;border-radius:10px;background:#1E1829;font-size:72px;font-weight:800;line-height:92px;text-align:center;transform-origin:50% 50%}
</style>
<div data-slot="world">
  <div id="stamp">дубль</div>
</div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lc">
    <div class="mono mut" id="lbl"></div>
    <div class="dg" id="d0" style="left:-93px"></div>
    <div class="dg" style="left:-41px;width:26px;background:none">:</div>
    <div class="dg" id="d1" style="left:-15px"></div>
    <div class="dg" id="d2" style="left:41px"></div>
  </div>
</div><!--/shape-->
<script>
// Overlay for the phone that fx.py draws at x 50–390, y 400–1004 (raw take, then this reel).
// Clean anchors (clip in = 14.073): «исходник» 14.75 → 0.26, «а вот» 16.35 → 1.86, «рилс» 17.10 → 2.61
// Real figures: raw 1:47 (PROBE.json 107.6 s), this reel 0:38 (clean 37.83 s, pauses ≤ 0.12 s).
const $=id=>document.getElementById(id);
const A='147', B='038', SW=1.86, FL=2.61;
const ds=[$('d0'),$('d1'),$('d2')];
const st=$('stamp');
M.scene({
  W:1080,H:1920,T:3.01,bg:null,center:[220,1088],intro:0.10,
  SH:{card:{w:340,h:172,r:28,bg:'#0E0B14',cam:1}},
  start:'card', SEQ:[],
  layers:[
    {el:'Lc',tin:0.10,tout:null,o:{din:0},update:(t)=>{
      M.setText($('lbl'),t<SW?'исходник':'этот рилс'); $('lbl').style.color=t<SW?'#8E86A3':'#B79CFF';
      ds.forEach((d,i)=>{const t0=FL+0.06*i, p=M.clamp((t-t0)/0.22);
        M.setText(d,p<0.5?A[i]:B[i]); d.style.transform=`scaleY(${Math.abs(Math.cos(Math.PI*p)).toFixed(3)})`;
        d.style.color=p>=0.5?'#B79CFF':'#F5F3FA';});
    }},
  ],
  extra:(t)=>{
    // stamp on the phone's top-left corner while the raw take plays
    const v=M.vis(t,0.26,SW,{din:0,lin:0.12,lout:0.12}); const k=M.S(t-0.26,18,0.5);
    st.style.left='-150px'; st.style.top='-640px';
    st.style.opacity=v.o; st.style.transform=`rotate(-8deg) scale(${(t<0.26?1.6:1.6-0.6*k).toFixed(3)})`;
  }
});
</script>
