<title>04 Таймлайн · паузы, оговорки, дубли</title>
<style>
/*COMMON*/
.blk{position:absolute;top:0;height:76px;border-radius:12px;overflow:hidden}
.blk i{position:absolute;bottom:0;width:4px;border-radius:2px;background:rgba(14,11,20,.35)}
.tg{position:absolute;top:0;font-size:32px;font-weight:600;white-space:nowrap}
</style>
<div data-slot="shape">
  <div class="L" id="Lt">
    <div class="a mono mut" style="left:-380px;top:34px;font-size:24px;white-space:nowrap">raw.mp4 · таймлайн</div>
    <div class="a" id="trk" style="left:-380px;top:92px;width:760px;height:76px"></div>
    <div class="a" id="tags" style="left:-380px;top:200px;width:760px;height:40px">
      <div class="tg" id="g0" style="left:0">паузы</div>
      <div class="tg" id="g1" style="left:250px">оговорки</div>
      <div class="tg" id="g2" style="left:540px">дубли</div>
    </div>
  </div>
</div><!--/shape-->
<script>
// Clean anchors (clip in = 8.95): «паузы» 9.66 → 0.71, «оговорки» 10.09 → 1.14, «дубли» 11.10 → 2.15
const $=id=>document.getElementById(id);
// speech blocks: k = 'ok' | 'flub' | 'dup'; widths illustrative, not measured
const B=[['ok',120],['ok',90],['flub',70],['ok',130],['dup',110],['ok',100]];
const GAP0=34, T_P=0.71, T_F=1.14, T_D=2.15;
const gap=M.track(GAP0,[[T_P,8,M.FAST]]);
const wf=M.track(1,[[T_F,0,M.FAST]]), wd=M.track(1,[[T_D,0,M.FAST]]);
const col={ok:'#F5F3FA',flub:'#B79CFF',dup:'#B79CFF'};
$('trk').innerHTML=B.map((b,i)=>{let bars='';for(let x=8;x<b[1]-6;x+=11){const h=14+((x*37+i*53)%40);bars+=`<i style="left:${x}px;height:${h}px"></i>`;}return `<div class="blk" id="k${i}" style="width:${b[1]}px;background:${col[b[0]]}">${bars}</div>`;}).join('');
const tagOn=[T_P,T_F,T_D];
M.scene({
  W:1080,H:1920,T:2.70,bg:null,center:[540,1100],intro:0.0,
  SH:{card:{w:840,h:270,r:36,bg:'#0E0B14',cam:1}},
  start:'card', SEQ:[],
  layers:[
    {el:'Lt',tin:0.0,tout:null,anchor:'t',o:{din:0},update:(t)=>{
      // whole track is centred so it visibly shrinks from both sides
      const ws=B.map(b=>b[1]*(b[0]==='flub'?Math.max(0,wf(t)):b[0]==='dup'?Math.max(0,wd(t)):1));
      const g=Math.max(0,gap(t)); let tot=ws.reduce((a,b)=>a+b,0)+g*(B.length-1); let x=(760-tot)/2;
      B.forEach((b,i)=>{const el=$('k'+i); el.style.left=x+'px'; el.style.width=ws[i]+'px'; el.style.opacity=ws[i]<2?0:1; x+=ws[i]+g;});
      tagOn.forEach((t0,i)=>{const e=$('g'+i), on=t>=t0, cur=on&&(i==2||t<tagOn[i+1]);
        e.style.opacity=on?(cur?1:0.45):0.18; e.style.color=cur?'#B79CFF':'#F5F3FA';});
    }},
  ],
});
</script>
