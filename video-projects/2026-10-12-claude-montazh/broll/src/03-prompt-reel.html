<style>
/*COMMON*/
.lab{position:absolute;left:-372px;top:-52px;font-size:22px;letter-spacing:.02em}
.send{position:absolute;left:300px;top:-36px;width:72px;height:72px;border-radius:36px}
</style>
<div data-slot="shape">
  <div class="L" id="Lin">
    <div class="lab mono mut">Claude</div>
    <div class="a mono" style="left:-372px;top:-16px;font-size:36px;white-space:nowrap"><span id="typed"></span><span id="caret" style="display:inline-block;width:3px;height:38px;background:#F5F3FA;vertical-align:-7px;margin-left:3px"></span></div>
    <div class="send" id="send"><div id="arr" style="position:absolute;left:18px;top:18px"></div></div>
  </div>
  <div class="L" id="Ldone">
    <div class="row" style="left:-262px;top:-30px;gap:22px;font-size:46px;font-weight:700"><span id="ck"></span>Готово</div>
    <div class="a mono mut" style="left:20px;top:-13px;font-size:26px;white-space:nowrap">raw.mp4 → рилс</div>
  </div>
</div><!--/shape-->
<script>
// Clean anchors (clip in = 6.53): «отдаю» 6.74 → 0.21, «видео» 7.58 → 1.05, «командой» 8.32 → 1.79
const $=id=>document.getElementById(id);
const CMD='/reel raw.mp4', TY0=0.25, TY1=0.85;
$('ck').innerHTML=`<svg width="56" height="56" viewBox="-28 -28 56 56"><circle r="28" fill="#B79CFF"/><path d="M-11 0 L-3 8 L12 -8" fill="none" stroke="#0E0B14" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
$('arr').innerHTML=`<svg width="36" height="36" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#0E0B14" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const sendBg=M.ctrack('#4A4258',[[TY1,'#F5F3FA'],[1.05,'#B79CFF']]);
M.scene({
  W:1080,H:1920,T:2.32,bg:null,center:[540,1100],intro:0.0,
  SH:{input:{w:820,h:150,r:36,bg:'#0E0B14',cam:1}, done:{w:600,h:130,r:65,bg:'#0E0B14',cam:1}},
  start:'input', SEQ:[[1.79,'done']], shapePress:[1.05],
  layers:[
    {el:'Lin',tin:0.0,tout:1.79,o:{din:0},update:(t)=>{
      const n=Math.round(M.clamp((t-TY0)/(TY1-TY0))*CMD.length); M.setText($('typed'),CMD.slice(0,n));
      $('caret').style.opacity=(t>1.05)?0:((t>TY0&&t<TY1+0.05)||Math.floor(t*2.4)%2==0?1:0);
      $('send').style.background=sendBg(t);
    }},
    {el:'Ldone',tin:1.79,tout:null},
  ],
});
</script>
