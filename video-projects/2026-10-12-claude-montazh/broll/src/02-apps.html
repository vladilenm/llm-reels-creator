<div data-slot="shape">

<script>
// Clean anchors (clip in = «CapCut» 4.794): strike CapCut 0.29, «ни» 5.30 → 0.51, «Премьера» 5.64 → 0.84 (strike 0.87)
// Neutral app tiles (Lucide «scissors» / «clapperboard» outlines, ISC), not the trademark logos.
const $=id=>document.getElementById(id);
const SC=c=>`<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg>`;
const CL=c=>`<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>`;
$('i1').innerHTML=SC('#0E0B14'); $('i2').innerHTML=SC('#0E0B14'); $('i3').innerHTML=CL('#B79CFF');
const sw=(t0)=>t=>M.eo(M.clamp((t-t0)/0.2))*150;
const S1=sw(0.29), S2=sw(0.87);
const dim=(t0)=>t=>1-0.6*M.clamp((t-t0-0.08)/0.2);
const D1=dim(0.29), D2=dim(0.87);
M.scene({
  W:1080,H:1920,T:1.55,bg:null,center:[540,1080],intro:0.0,
  SH:{one:{w:240,h:240,r:40,bg:'#0E0B14',cam:1}, two:{w:620,h:240,r:40,bg:'#0E0B14',cam:1}},
  start:'one', SEQ:[[0.51,'two']],
  layers:[
    {el:'L1',tin:0.0,tout:0.51,o:{din:0},update:(t)=>{$('s1').style.width=S1(t)+'px'; $('a1').style.opacity=D1(t);}},
    {el:'L2',tin:0.51,tout:null,update:(t)=>{$('t1').style.width='150px'; $('b1').style.opacity=0.4; $('t2').style.width=S2(t)+'px'; $('b2').style.opacity=D2(t);}},
  ],
});
</script>
