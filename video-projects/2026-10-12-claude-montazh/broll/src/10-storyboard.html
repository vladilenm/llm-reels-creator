<title>10 План перед рендером · одобрить</title>
<style>
/*COMMON*/
.hdr{position:absolute;top:156px;font-size:24px;letter-spacing:.04em;white-space:nowrap}
.rw{position:absolute;left:-380px;width:760px;height:100px}
.rw .c{position:absolute;top:30px;font-size:32px;white-space:nowrap}
.hl{position:absolute;border-radius:20px;background:rgba(183,156,255,.16)}
#btn{position:absolute;left:-180px;top:640px;width:360px;height:96px;border-radius:48px;font-size:36px;font-weight:700;line-height:96px;text-align:center}
</style>
<div data-slot="shape">
  <div class="L" id="Lp">
    <div class="a mono mut" style="left:-380px;top:44px;font-size:24px;white-space:nowrap">PLAN.md · этот рилс</div>
    <div class="a" style="left:-380px;top:84px;font-size:44px;font-weight:700;letter-spacing:-.02em;white-space:nowrap">План перед рендером</div>
    <div class="hl" id="hl"></div>
    <div class="hdr mono mut" id="h0" style="left:-380px">время</div>
    <div class="hdr mono mut" id="h1" style="left:-240px">графика</div>
    <div class="hdr mono mut" id="h2" style="left:150px">на слове</div>
    <div id="rows"></div>
    <div id="btn"></div>
  </div>
</div><!--/shape-->
<script>
// Clean anchors (clip in = «план» 26.55): «хук» 27.23 → 0.68, «графика» 28.23 → 1.68,
// «слове» 29.13 → 2.58, «одобряю» 29.96 → 3.41. Rows are real events of this PLAN.json.
const $=id=>document.getElementById(id);
const R=[['0:01','Хук · «Не монтировал»','монтировал'],['0:08','Таймлайн · паузы','паузы'],['0:14','Исходник → рилс','рилс'],['0:21','Субтитры вниз','вниз']];
$('rows').innerHTML=R.map((r,i)=>`<div class="rw" id="r${i}" style="top:${200+i*100}px"><div class="c mono mut" style="left:0">${r[0]}</div><div class="c" style="left:140px">${r[1]}</div><div class="c acc" style="left:530px">${r[2]}</div></div>`).join('');
const HK=[0.68,1.68,2.58];
// «хук» → the hook row; «графика» → graphics column; «слове» → word column
const BOX=[[-396,206,792,88],[-252,140,384,470],[138,140,258,470]];
const tr=k=>M.track(BOX[0][k],[[HK[1],BOX[1][k],M.MORPH],[HK[2],BOX[2][k],M.MORPH]]);
const hx=tr(0),hy=tr(1),hw=tr(2),hh=tr(3);
const ho=t=>M.clamp((t-HK[0])/0.15);
const OK=3.41;
const bbg=M.ctrack('#F5F3FA',[[OK,'#B79CFF']]);
M.scene({
  W:1080,H:1920,T:4.05,bg:'#0E0B14',center:[540,860],intro:0.05,
  SH:{card:{w:840,h:800,r:44,bg:'#17121F',cam:1}},
  start:'card', SEQ:[], shapePress:[OK],
  layers:[
    {el:'Lp',tin:0.05,tout:null,anchor:'t',o:{din:0},update:(t)=>{
      R.forEach((_,i)=>{const v=M.vis(t,0.12+0.10*i,null,{din:0,lin:0.22}); const e=$('r'+i); e.style.opacity=v.o; e.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none';});
      const h=$('hl'); h.style.opacity=ho(t); h.style.left=hx(t)+'px'; h.style.top=hy(t)+'px'; h.style.width=hw(t)+'px'; h.style.height=hh(t)+'px';
      [0,1,2].forEach(i=>{const cur=(i==1&&t>=HK[1]&&t<HK[2])||(i==2&&t>=HK[2]); $('h'+i).style.color=cur?'#B79CFF':'#8E86A3';});
      const b=$('btn'); b.style.background=bbg(t); b.style.color='#0E0B14'; M.setText(b,t>=OK?'✓ Одобрено':'Одобрить');
      const p=Math.exp(-Math.pow((t-OK-0.05)/0.08,2)); b.style.transform=`scale(${1-0.06*p})`;
    }},
  ],
});
</script>
