<title>01 OpenAI · 722 задачи</title>
<style>
/*COMMON*/
.num{font-size:210px;font-weight:800;letter-spacing:-.055em;line-height:1}
.tile{position:absolute;width:40px;height:40px;border-radius:11px;background:#E6E3DE}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill"><div class="row" style="transform:translate(-50%,-50%);color:#F4F2EE;font-size:66px;font-weight:700;letter-spacing:-.03em">OpenAI</div></div>
  <div class="L" id="Lcard">
    <div class="row sub" id="labA" style="left:-330px;top:46px">OpenAI</div>
    <div class="row sub" id="labB" style="left:-330px;top:46px;gap:12px;color:#0B0B0F"><span id="icChk"></span>решённые задачи</div>
    <div class="a num" id="num" style="left:-338px;top:92px">0</div>
    <div class="a" id="grid" style="left:-306px;top:330px"></div>
  </div>
</div><!--/shape-->
<script>
// Clean-timeline anchors (clip in = 1.10): «OpenAI» 0.06, «выпустила» 0.64, «свет» 1.60, «722» 2.87, «решённые» 4.69
const $=id=>document.getElementById(id);
const ACC='#FF5A1F', INK='#0B0B0F';
$('icChk').innerHTML=M.icon('check',34,INK,3);
const N=72, COLS=12;
$('grid').innerHTML=Array.from({length:N},(_,i)=>`<div class="tile" id="t${i}" style="left:${(i%COLS)*52}px;top:${Math.floor(i/COLS)*52}px"></div>`).join('');
const T0=0.9, T722=2.87, TSOLVED=4.69;
const frac=t=>{const p=M.clamp((t-T0)/(T722-T0)); return 1-Math.pow(1-p,3);};
const numCol=M.ctrack(INK,[[T722,ACC]],[22,1]);
M.scene({
  W:1080,H:1920,T:7.31,intro:-0.1,center:[540,760],
  bg:'radial-gradient(ellipse 70% 38% at 50% 40%, rgba(255,90,31,.13), rgba(255,90,31,0) 70%), #E9E7E2',
  SH:{pill:{w:470,h:150,r:75,bg:INK,cam:1}, card:{w:780,h:660,r:48,bg:'#FFFFFF',cam:1}},
  start:'pill', SEQ:[[0.64,'card']],
  layers:[
    {el:'Lpill',tin:null,tout:0.64},
    {el:'Lcard',tin:0.64,tout:null,anchor:'t',update:(t)=>{
      M.apply($('labA'),M.vis(t,0.64,TSOLVED,{din:0.08,lin:0.25}));
      M.apply($('labB'),M.vis(t,TSOLVED,null,{din:0.06,lin:0.25}));
      const f=frac(t), n=$('num');
      M.setText(n,String(Math.round(722*f)));
      n.style.color=numCol(t);
      const k=M.clamp((t-T722)/0.32); n.style.transform=`scale(${1+0.06*Math.sin(Math.PI*k)})`; n.style.transformOrigin='0 60%';
      for(let i=0;i<N;i++){
        const s=$('t'+i).style, a=M.clamp(f*N-i);
        s.opacity=a; s.transform=`scale(${0.6+0.4*a})`;
        const d=M.clamp((t-TSOLVED-i*0.011)/0.16);
        s.background=d>0?`rgb(${Math.round(230-219*d)},${Math.round(227-216*d)},${Math.round(222-207*d)})`:'#E6E3DE';
      }
    }},
  ],
  cursor:{size:46,clicks:[0.64],keys:[[0,330,280],[0.42,95,35],[0.8,95,35],[1.5,352,300],[7.31,352,300]]},
});
</script>
