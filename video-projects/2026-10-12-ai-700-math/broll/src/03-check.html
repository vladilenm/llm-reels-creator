<title>03 Проверка · порог 80%</title>
<style>
/*COMMON*/
.rw{position:absolute;left:-330px;width:660px;height:52px}
.st{position:absolute;left:0;top:4px;width:44px;height:44px}
.bar{position:absolute;left:70px;top:19px;height:14px;border-radius:7px;background:#E6E3DE}
#track{position:absolute;left:-330px;top:600px;width:660px;height:20px;border-radius:10px;background:#E6E3DE;overflow:hidden}
#fill{position:absolute;left:0;top:0;height:20px;width:0;background:#0B0B0F;border-radius:10px}
#mark{position:absolute;top:584px;width:4px;height:52px;border-radius:2px;background:#FF5A1F}
</style>
<div data-slot="shape">
  <div class="L" id="Lcard">
    <div class="row hd" style="left:-330px;top:42px;gap:14px;color:#0B0B0F"><span id="icHd"></span>проверка решений</div>
    <div id="rows"></div>
    <div class="a" style="left:-330px;top:486px;width:660px;height:2px;background:#EEEBE6"></div>
    <div class="row" id="thr" style="left:-330px;top:512px;gap:16px"><span class="sub">если хотя бы</span><span style="font-size:52px;font-weight:800;letter-spacing:-.03em;color:#FF5A1F">80%</span><span class="sub">верны</span></div>
    <div id="track"><div id="fill"></div></div>
    <div id="mark" style="left:196px"></div>
  </div>
</div><!--/shape-->
<script>
// Clean-timeline anchors (clip in = 24.10): «проверить» 0.10, «решения» 1.06, «80%» 2.90, «решены» 5.10, «правильно» 5.61
const $=id=>document.getElementById(id);
const ACC='#FF5A1F', INK='#0B0B0F';
$('icHd').innerHTML=M.icon('search',40,INK,2.5);
const BW=[420,360,450,300,390], R=BW.length;
$('rows').innerHTML=BW.map((w,i)=>`<div class="rw" style="top:${126+i*70}px"><div class="st" id="s${i}"></div><div class="bar" style="width:${w}px"></div></div>`).join('');
const SCAN=BW.map((_,i)=>0.10+i*0.16);            // rows start checking on «проверить»
const DONE=[5.10,5.22,5.34,5.46];                  // 4 of 5 get a check on «решены правильно»; the 5th stays open
const spin=(t)=>`<svg width="44" height="44" viewBox="-22 -22 44 44"><circle r="17" fill="none" stroke="#E6E3DE" stroke-width="4"/><circle r="17" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round" stroke-dasharray="26 120" transform="rotate(${(t*420)%360})"/></svg>`;
const done=`<svg width="44" height="44" viewBox="-22 -22 44 44"><circle r="20" fill="${INK}"/><path d="M-8 0 L-2 6 L9 -6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const idle=`<svg width="44" height="44" viewBox="-22 -22 44 44"><circle r="17" fill="none" stroke="#E6E3DE" stroke-width="4"/></svg>`;
const fillW=M.track(0,[[5.10,528,M.SLOW]]);        // 80% of 660 = 528 px, reaches the mark on «правильно»
M.scene({
  W:1080,H:1920,T:6.50,intro:-0.1,center:[540,760],
  bg:'radial-gradient(ellipse 70% 38% at 50% 40%, rgba(255,90,31,.13), rgba(255,90,31,0) 70%), #E9E7E2',
  SH:{rows:{w:780,h:520,r:48,bg:'#FFFFFF',cam:1}, card:{w:780,h:660,r:48,bg:'#FFFFFF',cam:1}},
  start:'rows', SEQ:[[2.90,'card']],
  layers:[
    {el:'Lcard',tin:null,tout:null,anchor:'t',update:(t)=>{
      BW.forEach((_,i)=>{const el=$('s'+i), d=i<DONE.length&&t>=DONE[i];
        const html=d?done:(t>=SCAN[i]?spin(t):idle); if(el._h!==html){el.innerHTML=html; el._h=html;}
        if(d){const k=M.clamp((t-DONE[i])/0.25); el.style.transform=`scale(${1+0.15*Math.sin(Math.PI*k)})`;}});
      M.apply($('thr'),M.vis(t,2.90,null,{din:0,lin:0.25}));
      const tv=M.vis(t,2.90,null,{din:0.05,lin:0.25});
      $('track').style.opacity=tv.o; $('mark').style.opacity=tv.o;
      $('fill').style.width=Math.max(0,fillW(t))+'px';
    }},
  ],
});
</script>
