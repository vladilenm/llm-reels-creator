<title>01 Часы каждую неделю</title>
<style>
.lbl{font-size:46px;font-weight:600;letter-spacing:-.02em;color:#F4F2EE}
.day{position:absolute;top:30px;width:88px;height:88px;border-radius:24px;box-sizing:border-box;border:2px solid #3A3A40}
.dn{position:absolute;top:128px;width:88px;text-align:center;font-size:26px;font-weight:500;color:#8F8C86}
</style>
<div data-slot="shape">
  <div class="L" id="Lclock"><div class="a" id="clock" style="left:-85px;top:-85px"></div></div>
  <div class="L" id="Lweek">
    <div class="row lbl" style="left:-380px;top:40px;gap:16px"><span id="icClk"></span>часы каждую неделю</div>
    <div class="a" id="days" style="left:-380px;top:96px"></div>
  </div>
</div><!--/shape-->
<script>
// Clean-timeline anchors (clip in = 0.00): «часы» 1.455, «каждую» 2.015, «неделю» 2.715
const $=id=>document.getElementById(id);
const ACC='#FF5A1F', INK='#F4F2EE';
$('icClk').innerHTML=M.icon('clock',44,ACC);
$('clock').innerHTML=`<svg width="170" height="170" viewBox="-62 -62 124 124"><circle r="54" fill="none" stroke="${INK}" stroke-width="6"/><line id="hh" x1="0" y1="0" x2="0" y2="-26" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><line id="mh" x1="0" y1="0" x2="0" y2="-40" stroke="${ACC}" stroke-width="5" stroke-linecap="round"/><circle r="6" fill="${ACC}"/></svg>`;
const DAYS=['пн','вт','ср','чт','пт','сб','вс'];
$('days').innerHTML=DAYS.map((d,i)=>`<div class="day" id="d${i}" style="left:${i*112}px"></div><div class="dn" style="left:${i*112}px">${d}</div>`).join('');
const spin=M.track(0,[[1.455,720,[9,.9]]]);       // minute hand: two fast turns on «часы»
const hour=M.track(0,[[1.455,60,[9,.9]]]);
const FILL=[2.715,2.78,2.845,2.91,2.975,3.04,3.105]; // days fill on «неделю»
M.scene({
  W:1080,H:1920,bg:null,T:3.44,intro:null,center:[520,495],
  SH:{clock:{w:240,h:240,r:120,bg:'#0B0B0F',cam:1}, week:{w:820,h:262,r:48,bg:'#0B0B0F',cam:1}},
  start:'clock', SEQ:[[2.015,'week']],
  layers:[
    {el:'Lclock',tin:null,tout:2.015,update:(t)=>{$('mh').setAttribute('transform',`rotate(${spin(t)})`);$('hh').setAttribute('transform',`rotate(${hour(t)})`);}},
    {el:'Lweek',tin:2.015,tout:null,anchor:'t',update:(t)=>{
      DAYS.forEach((_,i)=>{const k=M.clamp((t-FILL[i])/0.18); const s=$('d'+i).style; s.background=`rgba(255,90,31,${k})`; s.borderColor=k>0.5?ACC:'#3A3A40'; s.transform=`scale(${1+0.08*Math.sin(Math.PI*k)})`;});
    }},
  ],
});
</script>
