<title>02 Агенты берут на себя рутину</title>
<style>
.hd{font-size:40px;font-weight:600;letter-spacing:-.02em}
.rw{position:absolute;left:-250px;width:500px;height:64px}
.cb{position:absolute;left:0;top:10px;width:44px;height:44px;border-radius:12px;box-sizing:border-box;border:3px solid #CFCAC2;display:flex;align-items:center;justify-content:center}
.bar{position:absolute;left:70px;top:24px;height:16px;border-radius:8px;background:#DCD8D1}
</style>
<div data-slot="shape">
  <div class="L" id="Llist">
    <div class="row hd" style="left:-250px;top:44px;gap:14px;color:#0B0B0B"><span id="icList"></span>Рутина</div>
    <div id="rowsA"></div>
  </div>
  <div class="L" id="Lagent">
    <div class="row hd" style="left:-250px;top:44px;gap:14px;color:#F4F2EE"><span id="icSpark"></span>Агент</div>
    <div id="rowsB"></div>
  </div>
</div><!--/shape-->
<script>
// Clean-timeline anchors (clip in = 6.66): «Агенты» 0.048, «берут» 0.546, «рутину» 2.086
const $=id=>document.getElementById(id);
$('icList').innerHTML=M.icon('file',38,'#0B0B0B'); $('icSpark').innerHTML=M.icon('sparkle',38,'#FF5A1F');
const BW=[360,300,390,250];
const rows=(id,dark)=>BW.map((w,i)=>`<div class="rw" style="top:${140+i*96}px"><div class="cb" id="${id}c${i}" style="${dark?'border-color:#4A4A50':''}"></div><div class="bar" id="${id}b${i}" style="width:${w}px;${dark?'background:#3A3A40':''}"></div></div>`).join('');
$('rowsA').innerHTML=rows('a',false); $('rowsB').innerHTML=rows('b',true);
const ROW_IN=[0.12,0.2,0.28,0.36];                 // rows grow in on «Агенты»
const CHECK=[2.09,2.2,2.31,2.42];                  // ticks on «рутину»
M.scene({
  W:1080,H:1920,bg:'#E9E7E2',T:2.84,intro:null,center:[540,770],
  SH:{list:{w:600,h:560,r:40,bg:'#FFFFFF',cam:1.3}, agent:{w:600,h:560,r:40,bg:'#0B0B0F',cam:1.3}},
  start:'list', SEQ:[[0.62,'agent']],
  layers:[
    {el:'Llist',tin:null,tout:0.62,anchor:'t',update:(t)=>{BW.forEach((w,i)=>{$('ab'+i).style.width=(w*M.eio((t-ROW_IN[i])/0.3))+'px';});}},
    {el:'Lagent',tin:0.62,tout:null,anchor:'t',update:(t)=>{
      CHECK.forEach((c,i)=>{const k=M.clamp((t-c)/0.16); const b=$('bc'+i); b.style.background=`rgba(255,90,31,${k})`; b.style.borderColor=k>0.5?'#FF5A1F':'#4A4A50'; b.innerHTML=k>0.5?M.icon('check',26,'#fff',3):''; $('bb'+i).style.opacity=String(1-0.5*k);});
    }},
  ],
  cursor:{size:44,clicks:[0.546],keys:[[0,760,1240],[0.3,760,1240],[0.5,330,560],[0.9,330,560],[1.4,880,1500]]},
});
</script>
