name: Check student kit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PUPPETEER_SKIP_DOWNLOAD: ${{ matrix.os != 'macos-latest' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        if: runner.os == 'macOS'
        run: python -m pip install numpy pillow
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - run: npm ci
      - name: Install Chromium for browser tests
        if: runner.os == 'macOS'
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Portable core tests
        if: runner.os != 'macOS'
        run: node --test --test-skip-pattern="^end to end:" tests/editing.test.mjs tests/short-form.test.mjs tests/long.test.mjs tests/stage-assemble.test.mjs
      - name: Full media test suite on the supported platform
        if: runner.os == 'macOS'
        run: npm test
      - run: npm run demo
      - run: node scripts/preflight.mjs video-projects/demo
      - run: npx hyperframes lint video-projects/demo
