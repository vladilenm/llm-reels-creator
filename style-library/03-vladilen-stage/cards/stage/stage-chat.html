<!doctype html>
<!--
  STAGE · chat · макет интерфейса: окно чата, сообщения печатаются на своих словах
  Слоты: kicker, tag, app (название в шапке окна), msg_user, msg_ai. Макет свой, без чужих логотипов и интерфейсов.
  Акцент один: пузырь пользователя. Текст сообщений ключевой, поэтому крупный (не мельче 40 px).
  data-at у .msg: секунда, когда начинается печать; у ответа за 0,9 с до неё показывается маленький пузырь с тремя точками.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="stage.css" />
    <style>
      #stage-chat .wrap { width: 1300px; display: flex; flex-direction: column; gap: var(--space-3); }
      #stage-chat .window { padding: 0; overflow: hidden; }
      #stage-chat .bar {
        display: flex; align-items: center; gap: var(--space-3); height: 72px; padding: 0 var(--space-4); flex: none;
        background: var(--surface-sunken); border-bottom: var(--stroke) solid var(--line);
      }
      #stage-chat .dots { display: flex; gap: var(--space-1); }
      #stage-chat .dots i { width: 16px; height: 16px; box-sizing: border-box; border-radius: var(--radius-full); border: var(--stroke-diagram) solid var(--line-strong); }
      #stage-chat .app { font-family: var(--font-mono); font-weight: var(--wt-label); font-size: var(--size-label); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-muted); }
      #stage-chat .thread { padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
      #stage-chat .msg { position: relative; max-width: 86%; box-sizing: border-box; padding: var(--space-3) var(--space-4); border-radius: var(--radius-xl); font-size: var(--size-key); line-height: var(--lh-key); }
      #stage-chat .msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: var(--radius-sm); }
      #stage-chat .msg.ai { align-self: flex-start; background: var(--surface-sunken); border: var(--stroke) solid var(--line); color: var(--ink); border-bottom-left-radius: var(--radius-sm); }
      #stage-chat .rest { visibility: hidden; }
      #stage-chat .typing {
        position: absolute; left: calc(var(--stroke) * -1); top: calc(var(--stroke) * -1); display: flex; gap: var(--space-1); box-sizing: border-box;
        padding: var(--space-3); background: var(--surface-sunken); border: var(--stroke) solid var(--line);
        border-radius: var(--radius-xl); border-bottom-left-radius: var(--radius-sm);
      }
      #stage-chat .typing i { width: 14px; height: 14px; border-radius: var(--radius-full); background: var(--ink-subtle); }
      #stage-chat .input {
        display: flex; align-items: center; justify-content: space-between; margin: 0 var(--space-5) var(--space-4); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4);
        box-sizing: border-box; border: var(--stroke) solid var(--line-strong); border-radius: var(--radius-full); font-size: var(--size-body); color: var(--ink-subtle);
      }
      #stage-chat .send { width: 48px; height: 48px; box-sizing: border-box; border-radius: var(--radius-full); border: var(--stroke-diagram) solid var(--line-strong); }
    </style>
  </head>
  <body>
    <div id="stage-chat" class="stage" data-composition-id="stage-chat" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <div class="glow"></div>
      <div class="grid"></div>
      <div class="dock" data-role="face-dock">лицо</div>
      <div class="scene-content">
        <div class="wrap">
          <div class="row">
            <div class="kicker" data-slot="kicker">08 / МАКЕТ</div>
            <div class="tag" data-slot="tag"></div>
          </div>
          <section class="card window">
            <div class="bar">
              <span class="dots"><i></i><i></i><i></i></span>
              <span class="app" data-slot="app">Чат с помощником</span>
            </div>
            <div class="thread">
              <div class="msg user" data-at="1.0"><span data-slot="msg_user">Составь список из пяти задач на неделю по важности.</span></div>
              <div class="msg ai" data-at="3.6"><i class="typing"><i></i><i></i><i></i></i><span data-slot="msg_ai">Готово. Вот пять задач: самое важное сверху, у каждой есть срок и критерий, по которому видно, что она закрыта.</span></div>
            </div>
            <div class="input"><span>Сообщение</span><i class="send"></i></div>
          </section>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = document.getElementById("stage-chat");
      const D = parseFloat(root.dataset.duration) || 10;
      const at = (el, d) => (el.dataset.at !== undefined ? parseFloat(el.dataset.at) : d);
      const wrap = root.querySelector(".wrap");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(wrap, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.1)
        .fromTo(root.querySelector(".kicker"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, 0.3);
      // печать: видимая часть и невидимый остаток лежат в одном элементе, поэтому пузырь сразу нужного размера
      const typeInto = (msg, slot, start, dur) => {
        const full = slot.textContent;
        slot.innerHTML = '<span class="typed"></span><span class="rest"></span>';
        const typed = slot.querySelector(".typed"), rest = slot.querySelector(".rest");
        const p = { n: 0 };
        const render = () => { const k = Math.round(p.n); typed.textContent = full.slice(0, k); rest.textContent = full.slice(k); };
        render();
        tl.fromTo(msg, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, start);
        tl.to(p, { n: full.length, duration: dur, ease: "none", onUpdate: render }, start + 0.2);
      };
      const user = root.querySelector(".msg.user"), ai = root.querySelector(".msg.ai");
      const userText = user.querySelector("[data-slot]").textContent.length;
      const aiText = ai.querySelector("[data-slot]").textContent.length;
      const col = (name) => getComputedStyle(root).getPropertyValue(name).trim();
      const dots = ai.querySelector(".typing"), dotItems = dots.querySelectorAll("i");
      typeInto(user, user.querySelector("[data-slot]"), at(user, 1.0), Math.min(2.4, Math.max(0.6, userText * 0.03)));
      // три точки показываются до ответа, потом исчезают, когда начинается печать
      tl.fromTo(ai, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at(ai, 3.6) - 0.9)
        .fromTo(dotItems, { y: 0 }, { y: -8, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.15 }, at(ai, 3.6) - 0.8)
        .to(dots, { opacity: 0, duration: 0.2, ease: "power1.in" }, at(ai, 3.6))
        // сам пузырь проявляется, когда начинается текст: до этого виден только маленький индикатор
        .fromTo(ai, { backgroundColor: "transparent", borderColor: "transparent" }, { backgroundColor: col("--surface-sunken"), borderColor: col("--line"), duration: 0.25, ease: "sine.inOut" }, at(ai, 3.6));
      {
        const slot = ai.querySelector("[data-slot]"), full = slot.textContent;
        slot.innerHTML = '<span class="typed"></span><span class="rest"></span>';
        const typed = slot.querySelector(".typed"), rest = slot.querySelector(".rest");
        const p = { n: 0 };
        const render = () => { const k = Math.round(p.n); typed.textContent = full.slice(0, k); rest.textContent = full.slice(k); };
        render();
        tl.to(p, { n: full.length, duration: Math.min(3, Math.max(0.8, aiText * 0.03)), ease: "none", onUpdate: render }, at(ai, 3.6));
      }
      tl.to(wrap, { opacity: 0, y: -160, filter: "blur(24px)", duration: 0.3, ease: "power2.in" }, D - 0.299);
      window.__timelines["stage-chat"] = tl;
    </script>
  </body>
</html>
