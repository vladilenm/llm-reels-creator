<!doctype html>
<!--
  STAGE · icons · 2–4 плитки: иконка, название, подпись, дата; плитки входят на своих словах
  Слоты: kicker, tag, headline, tiles (до 4; поля icon, label, note, meta), source.
  icon — имя из icons/icons.js (agent, terminal, hash, phone, chat, …) или путь к настоящему логотипу продукта (на светлой плашке).
  Акцент один: иконка активной плитки. Прошедшие плитки уходят в обычный цвет.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="stage.css" />
    <style>
      #stage-icons .icons { width: 1400px; gap: var(--space-5); }
      #stage-icons .tiles { display: flex; gap: var(--space-4); }
      #stage-icons .tile { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
      #stage-icons .tile .ic {
        width: 160px; height: 160px; box-sizing: border-box; padding: 32px; margin-bottom: var(--space-2);
        background: var(--surface-sunken); border: var(--stroke) solid var(--line); border-radius: var(--radius-xl); color: var(--ink-muted);
      }
      #stage-icons .tile .ic.logo { background: var(--paper); padding: 24px; }
      #stage-icons .t-label { font-size: var(--size-key); font-weight: var(--wt-title); line-height: 1.25; color: var(--ink); overflow-wrap: anywhere; }
      #stage-icons .t-note { font-size: var(--size-body); line-height: var(--lh-body); color: var(--ink-muted); }
      #stage-icons .t-meta, #stage-icons .source {
        font-family: var(--font-mono); font-weight: var(--wt-label); font-size: var(--size-label); line-height: var(--lh-label);
        letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-subtle);
      }
    </style>
  </head>
  <body>
    <div id="stage-icons" class="stage" data-composition-id="stage-icons" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <div class="glow"></div>
      <div class="grid"></div>
      <div class="dock" data-role="face-dock">лицо</div>
      <div class="scene-content">
        <section class="card icons">
          <div class="row">
            <div class="kicker" data-slot="kicker">11 / ИКОНКИ</div>
            <div class="tag" data-slot="tag"></div>
          </div>
          <h2 class="headline" data-slot="headline">Три способа работать с агентом</h2>
          <div class="tiles" data-slot="tiles">
            <div class="tile" data-at="1.2"><div class="ic" data-field="icon">terminal</div><div class="t-label" data-field="label">Терминал</div><div class="t-note" data-field="note">Привычный путь</div><div class="t-meta" data-field="meta">пример</div></div>
            <div class="tile" data-at="2.8"><div class="ic" data-field="icon">chat</div><div class="t-label" data-field="label">Чат</div><div class="t-note" data-field="note">Мессенджер команды</div><div class="t-meta" data-field="meta">пример</div></div>
            <div class="tile" data-at="4.4"><div class="ic" data-field="icon">phone</div><div class="t-label" data-field="label">Телефон</div><div class="t-note" data-field="note">Из любого места</div><div class="t-meta" data-field="meta">пример</div></div>
          </div>
          <div class="source" data-slot="source">Источник: подпись</div>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../icons/icons.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = document.getElementById("stage-icons");
      const D = parseFloat(root.dataset.duration) || 10;
      const col = (name) => getComputedStyle(root).getPropertyValue(name).trim();
      const at = (el, d) => (el.dataset.at !== undefined ? parseFloat(el.dataset.at) : d);
      const drawOn = window.stageIconsInit(root);
      const card = root.querySelector(".card");
      const tiles = [...root.querySelectorAll(".tile")];
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(card, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.1)
        .fromTo(root.querySelector(".kicker"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.3)
        .fromTo(root.querySelector(".headline"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.42)
        .fromTo(root.querySelector(".source"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, 0.9);
      tiles.forEach((tile, i) => {
        const t = at(tile, 1.2 + i * 1.6), ic = tile.querySelector(".ic"), prev = tiles[i - 1];
        tl.fromTo(tile, { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        drawOn(tl, ic, t + 0.1, 0.8);
        // активная плитка: акцент на иконке и рамке
        tl.fromTo(ic, { color: col("--ink-muted"), borderColor: col("--line") }, { color: col("--accent"), borderColor: col("--accent"), duration: 0.4, ease: "sine.inOut" }, t);
        if (prev) tl.to(prev.querySelector(".ic"), { color: col("--ink"), borderColor: col("--line-strong"), duration: 0.4, ease: "sine.inOut" }, t);
      });
      tl.to(card, { opacity: 0, y: -160, filter: "blur(24px)", duration: 0.3, ease: "power2.in" }, D - 0.299);
      window.__timelines["stage-icons"] = tl;
    </script>
  </body>
</html>
