<!doctype html>
<!--
  STAGE · scene · образ-метафора: крупная иконка рисуется линией, рядом мысль; можно «A → B»
  Слоты: kicker, tag, icon, icon2 (необязательно: вторая иконка после стрелки), headline, note, source.
  icon, icon2 — имена из icons/icons.js. Акцент один: акцентная деталь последней иконки.
  data-at: у icon (когда рисуется), у icon2 (если есть), у note.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="stage.css" />
    <style>
      #stage-scene .scene { width: 1440px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: var(--space-7); }
      #stage-scene .art { display: flex; align-items: center; gap: var(--space-4); }
      #stage-scene .art .ic { width: 340px; height: 340px; color: var(--ink); }
      #stage-scene .art.pair .ic { width: 250px; height: 250px; }
      #stage-scene .arrow { width: 96px; height: 96px; color: var(--ink-subtle); }
      #stage-scene .ic .a { stroke: var(--ink); }
      #stage-scene .art .ic.last .a { stroke: var(--accent); }
      #stage-scene .text { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
      #stage-scene .headline { font-size: var(--size-headline-lg); line-height: var(--lh-headline-lg); letter-spacing: var(--ls-headline-lg); }
      #stage-scene .note { font-size: var(--size-body-lg); line-height: var(--lh-body-lg); }
      #stage-scene .source {
        font-family: var(--font-mono); font-weight: var(--wt-label); font-size: var(--size-label); line-height: var(--lh-label);
        letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-subtle);
      }
    </style>
  </head>
  <body>
    <div id="stage-scene" class="stage" data-composition-id="stage-scene" data-start="0" data-width="1920" data-height="1080" data-duration="7">
      <div class="glow"></div>
      <div class="grid"></div>
      <div class="dock" data-role="face-dock">лицо</div>
      <div class="scene-content">
        <section class="scene">
          <div class="art">
            <div class="ic" data-slot="icon" data-at="0.5">prompt</div>
            <div class="ic arrow" data-stroke="1.2">arrow</div>
            <div class="ic" data-slot="icon2" data-at="1.6">flow</div>
          </div>
          <div class="text">
            <div class="row"><div class="kicker" data-slot="kicker">12 / ОБРАЗ</div><div class="tag" data-slot="tag"></div></div>
            <h2 class="headline" data-slot="headline">От промтов к системам</h2>
            <p class="note" data-slot="note" data-at="2.4">Образ занимает половину кадра и рисуется линией, пока звучит мысль.</p>
            <div class="source" data-slot="source">Источник: подпись</div>
          </div>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../icons/icons.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = document.getElementById("stage-scene");
      const D = parseFloat(root.dataset.duration) || 7;
      const at = (el, d) => (el.dataset.at !== undefined ? parseFloat(el.dataset.at) : d);
      const i1 = root.querySelector('[data-slot="icon"]'), i2 = root.querySelector('[data-slot="icon2"]'), arrow = root.querySelector(".arrow");
      const pair = i2.textContent.trim() !== "";
      if (pair) root.querySelector(".art").classList.add("pair"); else arrow.remove();
      (pair ? i2 : i1).classList.add("last");
      const drawOn = window.stageIconsInit(root, pair ? 1.2 : 1);
      const scene = root.querySelector(".scene");
      const note = root.querySelector(".note");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(scene, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.1)
        .fromTo(root.querySelector(".kicker"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.3)
        .fromTo(root.querySelector(".headline"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.4)
        .fromTo(note, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at(note, 2.4))
        .fromTo(root.querySelector(".source"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, at(note, 2.4) + 0.3);
      // образ рисуется линией: первая иконка на своём слове, стрелка и вторая — на своём
      drawOn(tl, i1, at(i1, 0.5), 1.1);
      if (pair) { drawOn(tl, arrow, at(i2, 1.6) - 0.4, 0.4, "power1.inOut"); drawOn(tl, i2, at(i2, 1.6), 1.1); }
      tl.to(scene, { opacity: 0, y: -160, filter: "blur(24px)", duration: 0.3, ease: "power2.in" }, D - 0.299);
      window.__timelines["stage-scene"] = tl;
    </script>
  </body>
</html>
