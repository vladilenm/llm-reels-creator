<!doctype html>
<!--
  STAGE · quote · цитата крупно на сцене, без поверхности
  Слоты: kicker, quote (внутри <em> — ключевое слово, загорается акцентом на data-at), source.
  Короткая цитата (до 60 знаков) набирается крупно (display), длинная — headline-lg.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="stage.css" />
    <style>
      #stage-quote .quote { margin: 0; width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: var(--space-4); }
      #stage-quote .text {
        margin: 0; text-wrap: balance; color: var(--ink);
        font-family: var(--font-display); font-weight: var(--wt-display);
        font-size: var(--size-headline-lg); line-height: var(--lh-headline-lg); letter-spacing: var(--ls-headline-lg);
      }
      #stage-quote .text.big { font-size: var(--size-display); line-height: var(--lh-display); letter-spacing: var(--ls-display); }
      #stage-quote .text em { font-style: italic; font-weight: 300; color: var(--ink); }
      #stage-quote .source { font-size: var(--size-body); line-height: var(--lh-body); color: var(--ink-muted); }
    </style>
  </head>
  <body>
    <div id="stage-quote" class="stage" data-composition-id="stage-quote" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div class="glow"></div>
      <div class="grid"></div>
      <div class="dock" data-role="face-dock">лицо</div>
      <div class="scene-content">
        <figure class="quote">
          <div class="kicker" data-slot="kicker">03 / ЦИТАТА</div>
          <div class="rule"></div>
          <blockquote class="text" data-slot="quote">«Хорошая карточка говорит одну <em data-at="2.2">мысль</em>, и зритель читает её за секунду.»</blockquote>
          <figcaption class="source" data-slot="source">Пример подписи: автор, источник, год</figcaption>
        </figure>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = document.getElementById("stage-quote");
      const D = parseFloat(root.dataset.duration) || 8;
      const col = (name) => getComputedStyle(root).getPropertyValue(name).trim();
      const at = (el, d) => (el.dataset.at !== undefined ? parseFloat(el.dataset.at) : d);
      const q = root.querySelector('[data-slot="quote"]');
      if (q.textContent.trim().length <= 60) q.classList.add("big");
      const fig = root.querySelector(".quote");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(fig, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.1)
        .fromTo(root.querySelector(".rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 0.3)
        .fromTo(q, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.4)
        .fromTo(root.querySelector(".source"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.2);
      // ключевое слово загорается акцентом, когда его произносят
      root.querySelectorAll("em").forEach((em) => tl.to(em, { color: col("--accent-text"), duration: 0.4, ease: "sine.inOut" }, at(em, 2.2)));
      tl.to(fig, { opacity: 0, y: -160, filter: "blur(24px)", duration: 0.3, ease: "power2.in" }, D - 0.299);
      window.__timelines["stage-quote"] = tl;
    </script>
  </body>
</html>
