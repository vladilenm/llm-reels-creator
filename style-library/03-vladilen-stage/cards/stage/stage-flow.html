<!doctype html>
<!--
  STAGE · flow · схема-цепочка из 3–4 узлов, узлы зажигаются по очереди на своих словах
  Слоты: kicker, tag, headline, nodes (до 4 узлов, поле label), note. Узлов меньше четырёх: удали пару «узел + стрелка» с конца.
  Акцент на одном узле: активном. Прошедшие узлы переходят в цвет текста. Линии схемы не тоньше 3 px.
  Схема условная, поэтому по умолчанию помечена «ИЛЛЮСТРАЦИЯ»; для схемы с настоящими данными метку убирают.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="stage.css" />
    <style>
      #stage-flow .flow { width: 1400px; gap: var(--space-4); }
      #stage-flow .chain { display: flex; align-items: center; padding: var(--space-4) 0; }
      #stage-flow .node {
        flex: 0 0 272px; min-height: 176px; box-sizing: border-box; padding: var(--space-3) var(--space-2);
        display: flex; align-items: center; justify-content: center; text-align: center;
        background: var(--surface-sunken); border: var(--stroke-diagram) solid var(--line-strong); border-radius: var(--radius-lg);
      }
      #stage-flow .node { flex-direction: column; gap: var(--space-2); }
      #stage-flow .node .ic { width: 72px; height: 72px; color: var(--ink-muted); }
      #stage-flow .node span { font-size: var(--size-key); font-weight: var(--wt-title); line-height: 1.25; color: var(--ink-muted); overflow-wrap: anywhere; }
      #stage-flow .edge { flex: 1 1 48px; position: relative; height: 18px; }
      #stage-flow .line { position: absolute; left: 0; right: 14px; top: 7.5px; height: var(--stroke-diagram); background: var(--ink-muted); transform-origin: left center; }
      #stage-flow .head { position: absolute; right: 0; top: 0; width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 14px solid var(--ink-muted); }
      #stage-flow .flow .note { font-size: var(--size-body); }
    </style>
  </head>
  <body>
    <div id="stage-flow" class="stage" data-composition-id="stage-flow" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <div class="glow"></div>
      <div class="grid"></div>
      <div class="dock" data-role="face-dock">лицо</div>
      <div class="scene-content">
        <section class="card flow">
          <div class="row">
            <div class="kicker" data-slot="kicker">10 / СХЕМА</div>
            <div class="tag" data-slot="tag">ИЛЛЮСТРАЦИЯ</div>
          </div>
          <h2 class="headline" data-slot="headline">Путь задачи от идеи до результата</h2>
          <div class="chain" data-slot="nodes">
            <div class="node" data-at="1.4"><i class="ic" data-field="icon">tasks</i><span data-field="label">Задача</span></div>
            <i class="edge"><b class="line"></b><b class="head"></b></i>
            <div class="node" data-at="3.2"><i class="ic" data-field="icon">layers</i><span data-field="label">Контекст</span></div>
            <i class="edge"><b class="line"></b><b class="head"></b></i>
            <div class="node" data-at="5.0"><i class="ic" data-field="icon">agent</i><span data-field="label">Агент</span></div>
            <i class="edge"><b class="line"></b><b class="head"></b></i>
            <div class="node" data-at="6.8"><i class="ic" data-field="icon">check</i><span data-field="label">Результат</span></div>
          </div>
          <p class="note" data-slot="note">Каждый узел загорается, когда о нём говорят.</p>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../../icons/icons.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = document.getElementById("stage-flow");
      const D = parseFloat(root.dataset.duration) || 10;
      const col = (name) => getComputedStyle(root).getPropertyValue(name).trim();
      const at = (el, d) => (el.dataset.at !== undefined ? parseFloat(el.dataset.at) : d);
      const card = root.querySelector(".card");
      const drawOn = window.stageIconsInit(root, 1.4);
      const nodes = [...root.querySelectorAll(".node")];
      const edges = [...root.querySelectorAll(".edge")];
      const times = nodes.map((n, i) => at(n, 1.4 + i * 1.8));
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(card, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.1)
        .fromTo(root.querySelector(".kicker"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.3)
        .fromTo(root.querySelector(".headline"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.42)
        .fromTo(root.querySelector(".note"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, 0.9);
      nodes.forEach((n, i) => {
        const t = times[i], label = n.querySelector("span"), prev = nodes[i - 1];
        tl.fromTo(n, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        const ic = n.querySelector(".ic");
        if (ic && ic.firstElementChild) { drawOn(tl, ic, t + 0.1, 0.7); tl.fromTo(ic, { color: col("--ink-muted") }, { color: col("--accent"), duration: 0.4, ease: "sine.inOut" }, t); if (prev && prev.querySelector(".ic")) tl.to(prev.querySelector(".ic"), { color: col("--ink"), duration: 0.4, ease: "sine.inOut" }, t); }
        // активный узел: акцент на рамке и подписи
        tl.fromTo(n, { borderColor: col("--line-strong") }, { borderColor: col("--accent"), duration: 0.4, ease: "sine.inOut" }, t);
        tl.fromTo(label, { color: col("--ink-muted") }, { color: col("--accent-text"), duration: 0.4, ease: "sine.inOut" }, t);
        if (prev) {
          const edge = edges[i - 1];
          tl.fromTo(edge.querySelector(".line"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, t - 0.4);
          tl.fromTo(edge.querySelector(".head"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, t - 0.1);
          // прошлый узел уходит в обычный цвет
          tl.to(prev, { borderColor: col("--ink-muted"), duration: 0.4, ease: "sine.inOut" }, t);
          tl.to(prev.querySelector("span"), { color: col("--ink"), duration: 0.4, ease: "sine.inOut" }, t);
        }
      });
      tl.to(card, { opacity: 0, y: -160, filter: "blur(24px)", duration: 0.3, ease: "power2.in" }, D - 0.299);
      window.__timelines["stage-flow"] = tl;
    </script>
  </body>
</html>
