<!doctype html>
<!--
  STAGE · doc · статья или документ на светлой бумаге с подсвеченной фразой
  Слоты: kicker, source (адрес или название источника в шапке), title, body (внутри <mark> — фраза, которую
  произносят вслух; подсвечивается на data-at). Остальной текст страницы служит фоном.
  Источник подписывается всегда: это чужой материал, а не наша графика.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="stage.css" />
    <style>
      #stage-doc .doc { width: 1240px; padding: 0; overflow: hidden; }
      #stage-doc .bar {
        display: flex; align-items: center; gap: var(--space-3); height: 72px; padding: 0 var(--space-4); flex: none;
        background: var(--paper-line); border-bottom: var(--stroke) solid var(--paper-line);
      }
      #stage-doc .dots { display: flex; gap: var(--space-1); }
      #stage-doc .dots i { width: 16px; height: 16px; box-sizing: border-box; border-radius: var(--radius-full); border: var(--stroke-diagram) solid var(--paper-muted); }
      #stage-doc .url { font-family: var(--font-mono); font-weight: var(--wt-label); font-size: var(--size-label); letter-spacing: var(--ls-label); color: var(--paper-muted); }
      #stage-doc .page { padding: var(--space-5) var(--space-6) var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); }
      #stage-doc .title {
        margin: 0; text-wrap: balance; color: var(--paper-ink);
        font-family: var(--font-display); font-weight: var(--wt-headline);
        font-size: var(--size-headline-md); line-height: var(--lh-headline-md); letter-spacing: var(--ls-headline-md);
      }
      #stage-doc .body { margin: 0; font-size: var(--size-key); line-height: var(--lh-key); color: var(--paper-ink); }
      #stage-doc mark {
        color: inherit; background-color: transparent; padding: 2px var(--space-1); border-radius: var(--radius-sm);
        background-image: linear-gradient(var(--paper-mark), var(--paper-mark)); background-repeat: no-repeat;
        background-position: 0 100%; background-size: 0% 100%;
        -webkit-box-decoration-break: clone; box-decoration-break: clone;
      }
    </style>
  </head>
  <body>
    <div id="stage-doc" class="stage" data-composition-id="stage-doc" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div class="glow"></div>
      <div class="grid"></div>
      <div class="dock" data-role="face-dock">лицо</div>
      <div class="scene-content">
        <article class="card paper doc">
          <div class="bar">
            <span class="dots"><i></i><i></i><i></i></span>
            <span class="url" data-slot="source">example.com / статья</span>
          </div>
          <div class="page">
            <div class="kicker" data-slot="kicker">05 / ИСТОЧНИК</div>
            <h2 class="title" data-slot="title">Как устроена хорошая постановка задачи</h2>
            <p class="body" data-slot="body">Это образец текста статьи. <mark data-at="2.4">Цитируемая фраза подсвечивается в тот момент, когда её произносят вслух.</mark> Остальной текст служит фоном.</p>
          </div>
        </article>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = document.getElementById("stage-doc");
      const D = parseFloat(root.dataset.duration) || 8;
      const col = (name) => getComputedStyle(root).getPropertyValue(name).trim();
      const at = (el, d) => (el.dataset.at !== undefined ? parseFloat(el.dataset.at) : d);
      const card = root.querySelector(".card");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(card, { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.1)
        .fromTo(root.querySelector(".url"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, 0.4)
        .fromTo(root.querySelector(".kicker"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.4)
        .fromTo(root.querySelector(".title"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.5)
        .fromTo(root.querySelector(".body"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
      // фраза подсвечивается заливкой, которая заходит слева направо, когда её произносят
      root.querySelectorAll("mark").forEach((m) => tl.to(m, { backgroundSize: "100% 100%", color: col("--paper-accent"), duration: 0.8, ease: "power2.inOut" }, at(m, 2.4)));
      tl.to(card, { opacity: 0, y: -160, filter: "blur(24px)", duration: 0.3, ease: "power2.in" }, D - 0.299);
      window.__timelines["stage-doc"] = tl;
    </script>
  </body>
</html>
